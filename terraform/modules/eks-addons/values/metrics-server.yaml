---
defaultArgs:
  - --cert-dir=/tmp
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  - --kubelet-use-node-status-port
  - --metric-resolution=15s
  - --secure-port=10250

# metric-resolution=15s:  Tells Metrics Server to collect/update metrics every 15 seconds.
# secure-port=10250:  Configures Metrics Server itself to serve its HTTPS API on port 10250.
name: Terraform apply

on:
  push:
    branches:
      - dev
      - prod

  pull_request:
    branches:
      - dev
      - prod

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # TF_ENV = base.ref if its pull_request
    # TF_ENV = ref_name if its push
    # TF_DIR = terraform/environmets/TF_ENV
    env:
      TF_ENV: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
      TF_DIR: terraform/environments/${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
      TF_VAR_eks_admin_user: ${{ secrets.EKS_ADMIN_USER }}
      TF_VAR_k8s_redis_url: ${{ secrets.K8S_REDIS_URL }}
      TF_VAR_k8s_jwt_secret: ${{ secrets.K8S_JWT_SECRET }}
      TF_VAR_k8s_cron_secret: ${{ secrets.K8S_CRON_SECRET }}
      TF_VAR_k8s_cloudinary_cloud_name: ${{ secrets.K8S_CLOUDINARY_CLOUD_NAME }}
      TF_VAR_k8s_cloudinary_api_key: ${{ secrets.K8S_CLOUDINARY_API_KEY }}
      TF_VAR_k8s_cloudinary_api_secret: ${{ secrets.K8S_CLOUDINARY_API_SECRET }}
      TF_VAR_k8s_email_user: ${{ secrets.K8S_EMAIL_USER }}
      TF_VAR_k8s_email_pass: ${{ secrets.K8S_EMAIL_PASS }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_app_record_name: ${{ vars.APP_RECORD_NAME }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config=../../backend/${TF_ENV}.tfbackend

      # - name: Terraform Format Check
      #   working-directory: ${{ env.TF_DIR }}
      #   run: | 
      #     terraform fmt -check -recursive

      # - name: Terraform Validate
      #   working-directory: ${{ env.TF_DIR }}
      #   run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.TF_ENV }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    # Apply only after code is pushed to the environment branch.
    # PRs only run plan.
    if: github.event_name == 'push'

    environment:
      name: ${{ github.ref_name }}

    env:
      TF_ENV: ${{ github.ref_name }}
      TF_DIR: terraform/environments/${{ github.ref_name }}
      TF_VAR_eks_admin_user: ${{ secrets.EKS_ADMIN_USER }}
      TF_VAR_k8s_redis_url: ${{ secrets.K8S_REDIS_URL }}
      TF_VAR_k8s_jwt_secret: ${{ secrets.K8S_JWT_SECRET }}
      TF_VAR_k8s_cron_secret: ${{ secrets.K8S_CRON_SECRET }}
      TF_VAR_k8s_cloudinary_cloud_name: ${{ secrets.K8S_CLOUDINARY_CLOUD_NAME }}
      TF_VAR_k8s_cloudinary_api_key: ${{ secrets.K8S_CLOUDINARY_API_KEY }}
      TF_VAR_k8s_cloudinary_api_secret: ${{ secrets.K8S_CLOUDINARY_API_SECRET }}
      TF_VAR_k8s_email_user: ${{ secrets.K8S_EMAIL_USER }}
      TF_VAR_k8s_email_pass: ${{ secrets.K8S_EMAIL_PASS }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_app_record_name: ${{ vars.APP_RECORD_NAME }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ env.TF_ENV }}
          path: ${{ env.TF_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config=../../backend/${TF_ENV}.tfbackend

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 1 ]; then 
              terraform apply -auto-approve tfplan 
            else 
              terraform apply -auto-approve 
            fi 
            
            if [ "$?" -eq 0 ]; then 
              break 
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Apply failed after 3 attempts"
              exit 1
            fi

            echo "Apply failed (attempt $attempt/3), retrying in 30s..."
            sleep 30
          done
      
      

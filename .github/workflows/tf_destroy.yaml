name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy-plan:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    # For prod, configure this GitHub Environment with
    # required reviewers to require manual approval.
    environment:
      name: ${{ inputs.environment }}

    env:
      TF_ENV: ${{ inputs.environment }}
      TF_DIR: terraform/environments/${{ inputs.environment }}
      TF_VAR_eks_admin_user: ${{ secrets.EKS_ADMIN_USER }}
      TF_VAR_k8s_redis_url: ${{ secrets.K8S_REDIS_URL }}
      TF_VAR_k8s_jwt_secret: ${{ secrets.K8S_JWT_SECRET }}
      TF_VAR_k8s_cron_secret: ${{ secrets.K8S_CRON_SECRET }}
      TF_VAR_k8s_cloudinary_cloud_name: ${{ secrets.K8S_CLOUDINARY_CLOUD_NAME }}
      TF_VAR_k8s_cloudinary_api_key: ${{ secrets.K8S_CLOUDINARY_API_KEY }}
      TF_VAR_k8s_cloudinary_api_secret: ${{ secrets.K8S_CLOUDINARY_API_SECRET }}
      TF_VAR_k8s_email_user: ${{ secrets.K8S_EMAIL_USER }}
      TF_VAR_k8s_email_pass: ${{ secrets.K8S_EMAIL_PASS }}
      TF_VAR_alb_zone_id: ${{ vars.ALB_ZONE_ID }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_app_record_name: ${{ vars.APP_RECORD_NAME }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config=../../backend/${TF_ENV}.tfbackend

      - name: Terraform Plan Destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -destroy \
            -out=destroy.tfplan

      - name: Upload Terraform Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan-${{ env.TF_ENV }}
          path: ${{ env.TF_DIR }}/destroy.tfplan
          retention-days: 1

  terraform-destroy-apply:
    name: Terraform Destroy Apply
    runs-on: ubuntu-latest

    needs:
      - terraform-destroy-plan

    environment:
      name: ${{ inputs.environment }}

    env:
      TF_ENV: ${{ inputs.environment }}
      TF_DIR: terraform/environments/${{ inputs.environment }}
      TF_VAR_eks_admin_user: ${{ secrets.EKS_ADMIN_USER }}
      TF_VAR_k8s_redis_url: ${{ secrets.K8S_REDIS_URL }}
      TF_VAR_k8s_jwt_secret: ${{ secrets.K8S_JWT_SECRET }}
      TF_VAR_k8s_cron_secret: ${{ secrets.K8S_CRON_SECRET }}
      TF_VAR_k8s_cloudinary_cloud_name: ${{ secrets.K8S_CLOUDINARY_CLOUD_NAME }}
      TF_VAR_k8s_cloudinary_api_key: ${{ secrets.K8S_CLOUDINARY_API_KEY }}
      TF_VAR_k8s_cloudinary_api_secret: ${{ secrets.K8S_CLOUDINARY_API_SECRET }}
      TF_VAR_k8s_email_user: ${{ secrets.K8S_EMAIL_USER }}
      TF_VAR_k8s_email_pass: ${{ secrets.K8S_EMAIL_PASS }}
      TF_VAR_alb_zone_id: ${{ vars.ALB_ZONE_ID }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_app_record_name: ${{ vars.APP_RECORD_NAME }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Terraform Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan-${{ env.TF_ENV }}
          path: ${{ env.TF_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config=../../backend/${TF_ENV}.tfbackend

      - name: Terraform Apply Destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 1 ]; then 
              terraform apply --auto-approve destroy.tfplan 
            else 
              terraform destroy -auto-approve 
            fi 
            
            if [ "$?" -eq 0 ]; then 
              break 
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Destroy failed after 3 attempts"
              exit 1
            fi

            echo "Destroy failed (attempt $attempt/3), retrying in 30s..."
            sleep 30
          done